name: Apply Schengen visual redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-empty-trips.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply redesign
        run: python tools/apply_redesign.py
      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Apply visual redesign only"
          git push origin main
